name: Build and Push MCP Server Container

on:
  push:
    branches:
      - devel
  workflow_dispatch:

env:
  REGISTRY: quay.io
  IMAGE_NAME: cferman/ansible-platform-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Quay.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Pre-pull base image from public registry
        run: |
          podman pull registry.access.redhat.com/ubi8/python-311:latest

      - name: Extract metadata (tags, labels)
        id: meta
        run: |
          # Generate tags (newline-separated for buildah-build)
          TAGS="latest
          ${GITHUB_SHA::7}"

          # If on devel branch, also tag as devel
          if [[ "${{ github.ref }}" == "refs/heads/devel" ]]; then
            TAGS="${TAGS}
          devel"
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build container image
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          containerfiles: |
            ./Containerfile
          labels: |
            org.opencontainers.image.title=Ansible Platform MCP Server
            org.opencontainers.image.description=Model Context Protocol server for AI-agent access to AAP Gateway
            org.opencontainers.image.url=https://github.com/chadmf/ansible.platform
            org.opencontainers.image.source=https://github.com/chadmf/ansible.platform
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}

      - name: Push to Quay.io
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.REGISTRY }}

      - name: Print image URL
        run: |
          echo "Image pushed to:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devel"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA::7}"
